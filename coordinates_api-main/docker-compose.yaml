version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: coordinates-postgres
    environment:
      POSTGRES_DB: coordinates_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge